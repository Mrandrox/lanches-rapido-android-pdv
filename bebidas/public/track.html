<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhar pedido</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 18px 60px; }
    .order-head { text-align: center; margin-bottom: 26px; }
    .status-pill {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      background: var(--accent);
      color: #1a1305;
    }
    .eta { display: block; margin-top: 10px; color: var(--muted); }
    .timeline { display: grid; gap: 0; margin: 26px 0; }
    .step { display: flex; gap: 14px; position: relative; padding-bottom: 22px; }
    .step:last-child { padding-bottom: 0; }
    .step::before {
      content: '';
      position: absolute; left: 15px; top: 34px; bottom: 0;
      width: 2px; background: var(--line);
    }
    .step:last-child::before { display: none; }
    .step .dot {
      width: 32px; height: 32px; border-radius: 50%;
      flex: 0 0 32px;
      display: grid; place-items: center;
      background: var(--bg3); border: 2px solid var(--line);
      font-size: 13px;
    }
    .step.done .dot { background: var(--accent); border-color: var(--accent); color: #1a1305; }
    .step.active .dot { background: var(--ok); border-color: var(--ok); color: #04130a; }
    .step .info b { display: block; }
    .step .info small { color: var(--muted); }
    .card-order { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 18px; }
    .card-order .li { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--line); }
    .card-order .li:last-child { border-bottom: none; }
    .code-badge {
      font-size: 13px; color: var(--accent);
      background: rgba(232,179,58,.12);
      border: 1px dashed var(--accent2);
      border-radius: 999px; padding: 4px 12px; display: inline-block; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="order-head">
      <div class="code-badge" id="code">Carregando...</div>
      <div class="status-pill" id="status">—</div>
      <span class="eta" id="eta"></span>
    </div>
    <div class="timeline" id="timeline"></div>
    <div class="card-order" id="details"></div>
  </div>
  <script src="/track.js"></script>
</body>
</html>
