<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* data:; connect-src 'self' http://localhost:* ws://localhost:*; img-src 'self' data: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Lanches PDV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img id="loginLogo" class="login-logo" alt="" style="display:none">
    <div class="login-emoji" id="loginEmoji">🍔</div>
    <h1 id="loginStore">Lanches Rápido</h1>
    <p class="login-sub">Entre para começar</p>
    <div class="pin-row" id="pinRow"></div>
    <div class="pinpad" id="pinpad"></div>
    <div class="login-err" id="loginErr"></div>
    <button class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
    <div class="login-meta">PDV + Delivery com IA</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="app" id="app" style="display:none">

  <aside class="sidebar">
    <div class="brand">
      <img id="sideLogo" class="brand-logo" alt="" style="display:none">
      <div class="brand-text" id="sideName">Lanches</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <span class="avatar" id="userAvatar">A</span>
        <div class="user-meta">
          <strong id="userName">—</strong>
          <span id="userRole">—</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">🔁 Trocar de conta</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="screenTitle">PDV</div>
      <div class="topbar-right">
        <span class="cash-status" id="cashStatus" title="Fluxo de caixa">—</span>
        <span class="server-status" id="serverStatus" title="Servidor">●</span>
      </div>
    </header>
    <section class="content" id="screenContent">
      <div class="empty-state" id="bootLoading">Conectando ao servidor…</div>
    </section>
  </main>
</div>

<!-- ===================== MODAL ===================== -->
<div class="modal-backdrop" id="modalBackdrop" style="display:none">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="modules/receipts.js"></script>
<script src="modules/pdv.js"></script>
<script src="modules/orders.js"></script>
<script src="modules/menu.js"></script>
<script src="modules/customers.js"></script>
<script src="modules/cash.js"></script>
<script src="modules/reports.js"></script>
<script src="modules/settings.js"></script>
</body>
</html>
